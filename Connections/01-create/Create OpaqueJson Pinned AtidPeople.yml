info:
  name: Create OpaqueJson Pinned AtidPeople
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/Create?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        {
          "password": null,
          "name": "Bruno OpaqueJson Pinned AtidPeople",
          "description": "Opaque JSON connection pinned to la_master.atidpeople",
          "tags": [],
          "roles": [],
          "outOfChartRoles": [],
          "metadataValues": [],
          "extraMetadata": {
            "contentFormat": "OpaqueJson"
          },
          "content": {
            "updateWhileUsingConnection": false,
            "payload": {
              "connectorName": "oracle",
              "properties": {
                "connection-url": "jdbc:oracle:thin:@//host.docker.internal:1521/XE",
                "connection-user": "LA_MASTER",
                "connection-password": "!@#123qwe"
              }
            },
            "dataSource": {
              "_type": "OpaqueJson",
              "Details": [
                {
                  "_type": "Table",
                  "Id": "f5598cc4-b983-4396-a132-4647f42391ba",
                  "Name": "atidpeople",
                  "Schema": "la_master",
                  "InUse": true,
                  "Fields": [
                    {
                      "_type": "Column",
                      "Id": "cbb7f001-2efd-4ff7-adef-0d2c388eb127",
                      "Name": "id",
                      "InUse": true,
                      "Type": "Integer"
                    },
                    {
                      "_type": "Column",
                      "Id": "07b27384-074c-437d-a892-4fdfcc317fd6",
                      "Name": "name",
                      "InUse": true,
                      "Type": "Text"
                    }
                  ]
                }
              ]
            }
          }
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let id = null;
        if (typeof body === "string") {
          id = String(body).replaceAll('"', "").trim();
        } else if (body && typeof body === "object") {
          id = body.Id || body.id || body.ObjectId || body.objectId
            || (Array.isArray(body.Objects) && body.Objects[0] && (body.Objects[0].Id || body.Objects[0].id))
            || (body.Object && (body.Object.Id || body.Object.id));
        }
        if (id) {
          bru.setEnvVar("opaqueConnectionId", id);
          bru.setVar("opaqueConnectionId", id);
          bru.setEnvVar("connectionId", id);
          bru.setVar("connectionId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Pinned OpaqueJson create. updateWhileUsingConnection must be false and dataSource must be a non-empty OpaqueJson catalog.
  Default for this flag is true; omitting it stores a live connection with no selection.
  dataSource._type must be OpaqueJson. Do not send connectionType or connectionInfo.
  Table InUse is true so GetDataSources returns atidpeople. Preview often leaves InUse false until you select the table.
  Column Type 0 / 2 from preview is Integer / Text for Newtonsoft StringEnumConverter.
