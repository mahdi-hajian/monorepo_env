info:
  name: Create SqlServer
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/Create?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        {
          "password": null,
          "name": "Mohsen Test SqlServer",
          "description": "SQL Server connection",
          "tags": [],
          "roles": [],
          "outOfChartRoles": [],
          "metadataValues": [],
          "iconId": null,
          "parentId": null,
          "extraMetadata": {
            "connectionType": "SqlServer"
          },
          "content": {
            "connectionType": "SqlServer",
            "updateWhileUsingConnection": true,
            "connectionInfo": {
              "connectionType": "SqlServer",
              "server": "{{sqlServerServer}}",
              "port": {{sqlServerPort}},
              "username": "{{sqlServerUsername}}",
              "password": "{{sqlServerPassword}}",
              "dataBaseName": "{{sqlServerDatabase}}",
              "sslEnabled": false,
              "fetchAllSchemas": false
            }
          }
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let id = null;
        if (typeof body === "string") {
          id = String(body).replaceAll('"', "").trim();
        } else if (body && typeof body === "object") {
          id = body.Id || body.id || body.ObjectId || body.objectId
            || (Array.isArray(body.Objects) && body.Objects[0] && (body.Objects[0].Id || body.Objects[0].id))
            || (body.Object && (body.Object.Id || body.Object.id));
        }
        if (id) {
          bru.setEnvVar("sqlServerConnectionId", id);
          bru.setVar("sqlServerConnectionId", id);
          bru.setEnvVar("connectionId", id);
          bru.setVar("connectionId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Create an MSSQL / SqlServer connection. The database JSON field must be dataBaseName.
