info:
  name: Create OpaqueJson
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/Create?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        {
          "password": null,
          "name": "Bruno OpaqueJson",
          "description": "Opaque JSON connection",
          "tags": [],
          "roles": [],
          "outOfChartRoles": [],
          "metadataValues": [],
          "extraMetadata": {
            "contentFormat": "OpaqueJson"
          },
          "content": {
            "payload": {
            "connectorName": "oracle",
            "properties": {
              "connection-url": "jdbc:oracle:thin:@//host.docker.internal:1521/XE",
              "connection-user": "LA_MASTER",
              "connection-password": "!@#123qwe"
            }
          }
          }
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let id = null;
        if (typeof body === "string") {
          id = String(body).replaceAll('"', "").trim();
        } else if (body && typeof body === "object") {
          id = body.Id || body.id || body.ObjectId || body.objectId
            || (Array.isArray(body.Objects) && body.Objects[0] && (body.Objects[0].Id || body.Objects[0].id))
            || (body.Object && (body.Object.Id || body.Object.id));
        }
        if (id) {
          bru.setEnvVar("opaqueConnectionId", id);
          bru.setVar("opaqueConnectionId", id);
          bru.setEnvVar("connectionId", id);
          bru.setVar("connectionId", id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Create an OpaqueJson connection in live mode (updateWhileUsingConnection defaults to true).
  extraMetadata.contentFormat must be OpaqueJson.
  Do not send connectionType or connectionInfo.
  For a pinned selection, use Create OpaqueJson Pinned AtidPeople instead.
