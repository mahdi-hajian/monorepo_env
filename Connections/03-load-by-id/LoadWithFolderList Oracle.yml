info:
  name: LoadWithFolderList Oracle
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/LoadWithFolderList?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "LoadContent": true,
          "RequestedObjects": [
            {
              "Id": "{{oracleConnectionId}}"
            }
          ]
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Load one Oracle connection by id, including folder list.
