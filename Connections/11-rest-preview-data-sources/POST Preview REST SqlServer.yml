info:
  name: POST Preview REST SqlServer
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/data-sources/preview"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": "SqlServer",
        "ConnectionInfo": {
          "ConnectionType": "SqlServer",
          "Server": "{{sqlServerServer}}",
          "Port": {{sqlServerPort}},
          "Username": "{{sqlServerUsername}}",
          "Password": "{{sqlServerPassword}}",
          "DataBaseName": "{{sqlServerDatabase}}",
          "SslEnabled": false,
          "FetchAllSchemas": false
        },
        "ConnectionId": null,
        "Payload": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Typed SqlServer preview through ASP.NET. Requires Query Engine Manager relational fetchers.
  The database JSON field must be dataBaseName. Success is 200 OK.
