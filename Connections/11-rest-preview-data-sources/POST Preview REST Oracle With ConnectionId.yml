info:
  name: POST Preview REST Oracle With ConnectionId
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/data-sources/preview"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": "Oracle",
        "ConnectionInfo": {
          "ConnectionType": "Oracle",
          "Server": "{{oracleServer}}",
          "Port": {{oraclePort}},
          "Username": "{{oracleUsername}}",
          "Password": "{{oraclePassword}}",
          "ServiceName": "{{oracleServiceName}}"
        },
        "ConnectionId": "{{oracleConnectionId}}",
        "Payload": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Typed Oracle preview that also sends connectionId so persisted InUse flags are applied.
  REST cannot reuse a stored password the way Object Framework FetchDataSources does. Send the env password.
  Success is 200 OK.
