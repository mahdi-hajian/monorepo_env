info:
  name: UpdateContent S3
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/UpdateContent?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "force": true,
          "requestedObject": {
            "id": "{{s3ConnectionId}}"
          },
          "extraMetadata": {
            "connectionType": "S3",
            "contentFormat": "LegacyTyped"
          },
          "content": {
            "connectionType": "S3",
            "updateWhileUsingConnection": true,
            "connectionInfo": {
              "connectionType": "S3",
              "server": "{{s3Server}}",
              "port": {{s3Port}},
              "username": "{{s3Username}}",
              "password": "{{s3Password}}",
              "tableFormat": null,
              "isPasswordStored": false,
              "isPasswordChanged": true
            }
          }
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates S3 connection content. Username is access key, password is secret key.
