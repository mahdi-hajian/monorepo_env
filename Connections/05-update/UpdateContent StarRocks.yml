info:
  name: UpdateContent StarRocks
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/UpdateContent?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "force": true,
          "requestedObject": {
            "id": "{{starRocksConnectionId}}"
          },
          "extraMetadata": {
            "connectionType": "StarRocks",
            "contentFormat": "LegacyTyped"
          },
          "content": {
            "connectionType": "StarRocks",
            "updateWhileUsingConnection": true,
            "connectionInfo": {
              "connectionType": "StarRocks",
              "server": "{{starRocksServer}}",
              "port": {{starRocksPort}},
              "username": "{{starRocksUsername}}",
              "password": "{{starRocksPassword}}",
              "database": "{{starRocksDatabase}}",
              "catalog": "{{starRocksCatalog}}",
              "isPasswordStored": false,
              "isPasswordChanged": true
            }
          }
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates StarRocks connection content. ContentFormat must stay LegacyTyped.
