info:
  name: UpdateTags
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/UpdateTags?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "objectId": "{{connectionId}}",
          "force": true,
          "signature": "",
          "tags": []
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Replaces tags on the last created connection (connectionId).
  Empty tags clears them. Copy objectId from oracleConnectionId / starRocksConnectionId / ... as needed.
  If the server rejects empty signature, copy TagSignature from LoadUpdateSettings.
