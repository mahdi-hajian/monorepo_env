info:
  name: UpdateContent OpaqueJson
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/UpdateContent?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        {
          "force": true,
          "requestedObject": {
            "id": "{{opaqueConnectionId}}"
          },
          "extraMetadata": {
            "contentFormat": "OpaqueJson"
          },
          "content": {
            "payload": {
              "connectorName": "oracle",
              "properties": {
                "connection-url": "jdbc:oracle:thin:@//host.docker.internal:1521:XE",
                "connection-user": "LA_MASTER",
                "connection-password": "!@#123qwe"
              }
            }
          }
        }
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Updates OpaqueJson payload. Do not send connectionType, connectionInfo, or dataSource.
  ContentFormat cannot change after create. Same OpaqueContentNotEnabled guard as Create until it is removed.
