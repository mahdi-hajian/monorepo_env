info:
  name: UpdateMetadata OpaqueJson
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/UpdateMetadata?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        {
          "objectId": "{{opaqueConnectionId}}",
          "name": "Bruno OpaqueJson Updated",
          "description": "Opaque JSON connection (updated)",
          "force": true,
          "isActive": true,
          "updateIcon": false,
          "metadataValues": []
        }
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Updates OpaqueJson name and description only. Payload is UpdateContent.
