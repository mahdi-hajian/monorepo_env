info:
  name: FetchDataSources S3
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/FetchDataSources?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        "S3",
        {
          "connectionType": "S3",
          "server": "{{s3Server}}",
          "port": {{s3Port}},
          "username": "{{s3Username}}",
          "password": "{{s3Password}}",
          "tableFormat": null
        },
        null
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: S3 has no IDataSourceFetcher. This request is expected to return NotSupportedException: No data source fetcher for S3.
