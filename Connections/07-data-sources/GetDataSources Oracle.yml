info:
  name: GetDataSources Oracle
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/GetDataSources?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        "{{oracleConnectionId}}"
      ]

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        let sources = body;
        if (typeof body === "string") {
          try { sources = JSON.parse(body); } catch (e) { sources = null; }
        }
        if (Array.isArray(sources) && sources.length > 0) {
          const first = sources[0];
          const id = first && (first.Id || first.id);
          if (id) {
            bru.setEnvVar("oracleDataSourceId", id);
            bru.setVar("oracleDataSourceId", id);
            bru.setEnvVar("dataSourceId", id);
            bru.setVar("dataSourceId", id);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Loads data sources for the saved Oracle connection. Saves the first source id to oracleDataSourceId.
