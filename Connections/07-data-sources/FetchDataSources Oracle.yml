info:
  name: FetchDataSources Oracle
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/FetchDataSources?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        "Oracle",
        {
          "connectionType": "Oracle",
          "server": "{{oracleServer}}",
          "port": {{oraclePort}},
          "username": "{{oracleUsername}}",
          "password": "{{oraclePassword}}",
          "serviceName": "{{oracleServiceName}}"
        },
        null
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Live Oracle catalog fetch with env credentials. connectionId is null so persisted InUse state is not applied.
