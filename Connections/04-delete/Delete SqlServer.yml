info:
  name: Delete SqlServer
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/Delete?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        {
          "ObjectIds": [
            "{{sqlServerConnectionId}}"
          ]
        }
      ]
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const status = res.getStatus();
        if (status >= 200 && status < 300) {
          bru.setEnvVar("sqlServerConnectionId", "");
          bru.setVar("sqlServerConnectionId", "");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Deletes the SqlServer connection created by Create SqlServer.
