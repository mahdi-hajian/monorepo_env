info:
  name: TestConnection SqlServer
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/TestConnection?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: 0.0.0.0
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  body:
    type: json
    data: |-
      [
        "SqlServer",
        {
          "connectionType": "SqlServer",
          "server": "{{sqlServerServer}}",
          "port": {{sqlServerPort}},
          "username": "{{sqlServerUsername}}",
          "password": "{{sqlServerPassword}}",
          "dataBaseName": "{{sqlServerDatabase}}",
          "sslEnabled": false,
          "fetchAllSchemas": true
        },
        null
      ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Tests SqlServer with credentials from Local. Requires Query Engine Manager relational testers. The database JSON field must be dataBaseName.
