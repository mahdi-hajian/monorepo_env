info:
  name: TestConnection Oracle Stored Password
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/ConnectionObjectPackage/TestConnection?Mrpc-EngineName=LADW&Mrpc-EngineVersion=0.0.0.0&W_MultiTech=false&W_InputAsArray=true&W_HandlingMode=1"
  params:
    - name: Mrpc-EngineName
      value: LADW
      type: query
    - name: Mrpc-EngineVersion
      value: "0.0.0.0"
      type: query
    - name: W_MultiTech
      value: "false"
      type: query
    - name: W_InputAsArray
      value: "true"
      type: query
    - name: W_HandlingMode
      value: "1"
      type: query
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Mrpc-ExecNetTimeout
      value: "60000"
  auth: inherit
  body:
    type: json
    data: |-
      [
        "Oracle",
        {
          "connectionType": "Oracle",
          "server": "{{oracleServer}}",
          "port": {{oraclePort}},
          "username": "{{oracleUsername}}",
          "password": null,
          "serviceName": "{{oracleServiceName}}",
          "isPasswordStored": true,
          "isPasswordChanged": false
        },
        "{{oracleConnectionId}}"
      ]

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Tests Oracle using the password stored on oracleConnectionId. Run Create Oracle External first.
