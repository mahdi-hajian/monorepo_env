info:
  name: POST Test REST Invalid Typed Plus Payload
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": "Oracle",
        "ConnectionInfo": {
          "ConnectionType": "Oracle",
          "Server": "{{oracleServer}}",
          "Port": {{oraclePort}},
          "Username": "{{oracleUsername}}",
          "Password": "{{oraclePassword}}",
          "ServiceName": "{{oracleServiceName}}"
        },
        "ConnectionId": "{{oracleConnectionId}}",
        "Payload": {
          "connectorName": "oracle"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Negative case. A raw OpaqueJson test cannot include typed fields or connectionId.
  Expected error: A raw opaque connection test accepts only payload; typed fields and connectionId must not be provided.
