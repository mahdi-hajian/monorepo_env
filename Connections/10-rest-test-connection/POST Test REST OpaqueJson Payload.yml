info:
  name: POST Test REST OpaqueJson Payload
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": null,
        "ConnectionInfo": null,
        "ConnectionId": null,
        "Payload": {
          "connectorName": "oracle",
          "properties": {
            "connection-url": "jdbc:oracle:thin:@//host.docker.internal:{{oraclePort}}:{{oracleServiceName}}",
            "connection-user": "{{oracleUsername}}",
            "connection-password": "{{oraclePassword}}"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Raw OpaqueJson test with the same payload used by Create OpaqueJson.
  QEM V2 expects payload.connectorName and payload.properties, not flat Trino keys.
  Typed fields and connectionId must be null. QEM must have APP_V2_ENABLED=true.
  Success is 200 OK.
