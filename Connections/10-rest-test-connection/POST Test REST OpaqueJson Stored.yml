info:
  name: POST Test REST OpaqueJson Stored
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": null,
        "ConnectionInfo": null,
        "ConnectionId": "{{opaqueConnectionId}}",
        "Payload": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Tests a stored OpaqueJson connection. Run Create OpaqueJson first.
  LAP.DW loads the payload from disk. Do not send a raw payload in this shape.
  Success is 204 No Content.
