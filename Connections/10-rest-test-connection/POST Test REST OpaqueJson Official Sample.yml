info:
  name: POST Test REST OpaqueJson Official Sample
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": null,
        "ConnectionInfo": null,
        "ConnectionId": null,
        "Payload": {
          "connectorName": "oracle",
          "properties": {
            "connection-url": "jdbc:oracle:thin:@//host.docker.internal:{{oraclePort}}:{{oracleServiceName}}",
            "connection-user": "{{oracleUsername}}",
            "connection-password": "{{oraclePassword}}"
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Raw OpaqueJson test with QEM V2 payload (connectorName + properties).
  QEM must have APP_V2_ENABLED=true. Success is 200 OK.
