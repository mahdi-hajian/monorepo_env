info:
  name: POST Test REST StarRocks
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/connections/test"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-Api-Version
      value: "1"
  body:
    type: json
    data: |-
      {
        "ConnectionType": "StarRocks",
        "ConnectionInfo": {
          "ConnectionType": "StarRocks",
          "Server": "{{starRocksServer}}",
          "Port": {{starRocksPort}},
          "Username": "{{starRocksUsername}}",
          "Password": "{{starRocksPassword}}",
          "Database": "{{starRocksDatabase}}",
          "Catalog": "{{starRocksCatalog}}"
        },
        "ConnectionId": null
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Typed StarRocks test through ASP.NET. Success is 204 No Content.
